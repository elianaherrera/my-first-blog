<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DJ FUGA en movimiento</title>
<style>
  :root { --negro: #0C0C0E; --blanco: #F5F4F0; --magenta: #FF2E7E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--negro); }
  #escena {
    position: relative; margin: 0 auto; overflow: hidden;
    background: var(--negro);
  }
  #escena svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #grano {
    position: absolute; inset: 0; pointer-events: none; mix-blend-mode: overlay;
    opacity: .055;
  }
  #flash {
    position: absolute; inset: 0; pointer-events: none; background: var(--blanco); opacity: 0;
  }
</style>
</head>
<body>
<div id="escena">
  <svg id="stage" viewBox="0 0 3935 1800" preserveAspectRatio="xMidYMid meet"
       role="img" aria-label="Animación del logotipo DJ FUGA">
    <defs>
      <clipPath id="banda"><rect id="bandaRect" x="-400" y="-900" width="4735" height="2173"/></clipPath>
      <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7"/></filter>
    </defs>

    <rect id="barrido" x="0" y="0" width="3935" height="14" fill="#FF2E7E" opacity="0"/>

    <g clip-path="url(#banda)">
      <g id="fantasma" opacity="0"><path d="M2252 1031H2104.9Q2127.3 1045 2156 1053.5Q2205 1068 2268 1068Q2333 1068 2380.5 1048Q2428 1028 2453.5 986Q2479 944 2479 880Q2479 817 2456.5 777Q2434 737 2392 717.5Q2350 698 2292 698Q2245 698 2207 708.5Q2169 719 2142.5 738.5Q2116 758 2107 786H1848Q1866 698 1922.5 631Q1979 564 2071.5 525.5Q2164 487 2294 487Q2387 487 2467 512Q2547 537 2608 586.5Q2669 636 2703 709.5Q2737 783 2737 880Q2737 977 2703 1050.5Q2669 1124 2609.5 1173.5Q2550 1223 2472.5 1248Q2395 1273 2308 1273Q2212 1273 2142 1245Q2076 1218.6 2031.7 1173.9L2021 1255H1842V854H2252Z" fill="#FF2E7E"/></g>
      <g class="ltr" id="l0"><path d="M864 505V720H428V798H844V1013H428V1255H170V505Z" fill="#F5F4F0"/></g>
      <g class="ltr" id="l1"><path d="M1172 911Q1172 952 1186.5 981.5Q1201 1011 1231 1027Q1261 1043 1308 1043Q1356 1043 1386 1027.5Q1416 1012 1430 982Q1444 952 1444 911V505H1702V925Q1702 1030 1653 1108Q1604 1186 1515.5 1229.5Q1427 1273 1308 1273Q1190 1273 1101.5 1229.5Q1013 1186 963.5 1108Q914 1030 914 925V505H1172Z" fill="#F5F4F0"/></g>
      <g class="ltr" id="l2"><path d="M2252 1031H2104.9Q2127.3 1045 2156 1053.5Q2205 1068 2268 1068Q2333 1068 2380.5 1048Q2428 1028 2453.5 986Q2479 944 2479 880Q2479 817 2456.5 777Q2434 737 2392 717.5Q2350 698 2292 698Q2245 698 2207 708.5Q2169 719 2142.5 738.5Q2116 758 2107 786H1848Q1866 698 1922.5 631Q1979 564 2071.5 525.5Q2164 487 2294 487Q2387 487 2467 512Q2547 537 2608 586.5Q2669 636 2703 709.5Q2737 783 2737 880Q2737 977 2703 1050.5Q2669 1124 2609.5 1173.5Q2550 1223 2472.5 1248Q2395 1273 2308 1273Q2212 1273 2142 1245Q2076 1218.6 2031.7 1173.9L2021 1255H1842V854H2252Z" fill="#F5F4F0"/></g>
      <g class="ltr" id="l3"><path d="M3436 505 3765 1255H3490L3438.7 1129H3089.3L3038 1255H2763L3092 505ZM3355.2 924 3264 700 3172.8 924H3355.2Z" fill="#F5F4F0"/></g>
    </g>

    <rect class="rule" id="r0" x="170.0" y="1535.0" width="1502.6" height="20.0" fill="#F5F4F0"/>
    <rect class="rule" id="r1" x="2262.4" y="1535.0" width="1502.6" height="20.0" fill="#F5F4F0"/>
    <g class="dj" id="dj"><path d="M1857.8 1460Q1888.8 1460 1912.1 1470.5Q1935.3 1481.1 1948.2 1500.1Q1961.2 1519.2 1961.2 1545Q1961.2 1570.6 1948.2 1589.8Q1935.3 1608.9 1912.1 1619.5Q1888.8 1630 1857.8 1630H1767.6V1460ZM1995.2 1544.8H2052.3V1549.3Q2052.3 1566.8 2058.6 1575.5Q2065 1584.2 2080.4 1584.2Q2095.3 1584.2 2102.1 1576.3Q2108.9 1568.3 2108.9 1554.3V1460H2167.4V1557.5Q2167.4 1580.4 2156.5 1597.7Q2145.7 1615 2126.2 1624.6Q2106.7 1634.1 2080.4 1634.1Q2054.8 1634.1 2035.6 1624.1Q2016.5 1614.1 2006 1596.1Q1995.6 1578.1 1995.6 1554.3ZM1825.6 1577.9H1862.3Q1874.8 1577.9 1883.7 1573.9Q1892.7 1569.9 1897.5 1562.6Q1902.2 1555.2 1902.2 1545Q1902.2 1534.6 1897.5 1527.3Q1892.7 1520.1 1883.7 1516.1Q1874.8 1512.1 1862.3 1512.1H1825.6Z" fill="#F5F4F0"/></g>
    <g class="sp" id="sp"><path d="M1967.5 360C1956.2 300.4 1932.1 276.3 1872.5 265C1932.1 253.7 1956.2 229.6 1967.5 170C1978.8 229.6 2002.9 253.7 2062.5 265C2002.9 276.3 1978.8 300.4 1967.5 360Z" fill="#F5F4F0"/></g>
  </svg>
  <svg id="grano" aria-hidden="true"><rect width="100%" height="100%" filter="url(#grain)"/></svg>
  <div id="flash" aria-hidden="true"></div>
</div>

<script>
const D = {"vb": [0, 0, 3935, 1800], "letras": [{"cx": 517.0, "cy": 880.0}, {"cx": 1308.0, "cy": 889.0}, {"cx": 2289.5, "cy": 880.0}, {"cx": 3264.0, "cy": 880.0}], "g": {"cx": 2289.5, "cy": 880.0, "d": "M2252 1031H2104.9Q2127.3 1045 2156 1053.5Q2205 1068 2268 1068Q2333 1068 2380.5 1048Q2428 1028 2453.5 986Q2479 944 2479 880Q2479 817 2456.5 777Q2434 737 2392 717.5Q2350 698 2292 698Q2245 698 2207 708.5Q2169 719 2142.5 738.5Q2116 758 2107 786H1848Q1866 698 1922.5 631Q1979 564 2071.5 525.5Q2164 487 2294 487Q2387 487 2467 512Q2547 537 2608 586.5Q2669 636 2703 709.5Q2737 783 2737 880Q2737 977 2703 1050.5Q2669 1124 2609.5 1173.5Q2550 1223 2472.5 1248Q2395 1273 2308 1273Q2212 1273 2142 1245Q2076 1218.6 2031.7 1173.9L2021 1255H1842V854H2252Z"}, "dj": {"d": "M1857.8 1460Q1888.8 1460 1912.1 1470.5Q1935.3 1481.1 1948.2 1500.1Q1961.2 1519.2 1961.2 1545Q1961.2 1570.6 1948.2 1589.8Q1935.3 1608.9 1912.1 1619.5Q1888.8 1630 1857.8 1630H1767.6V1460ZM1995.2 1544.8H2052.3V1549.3Q2052.3 1566.8 2058.6 1575.5Q2065 1584.2 2080.4 1584.2Q2095.3 1584.2 2102.1 1576.3Q2108.9 1568.3 2108.9 1554.3V1460H2167.4V1557.5Q2167.4 1580.4 2156.5 1597.7Q2145.7 1615 2126.2 1624.6Q2106.7 1634.1 2080.4 1634.1Q2054.8 1634.1 2035.6 1624.1Q2016.5 1614.1 2006 1596.1Q1995.6 1578.1 1995.6 1554.3ZM1825.6 1577.9H1862.3Q1874.8 1577.9 1883.7 1573.9Q1892.7 1569.9 1897.5 1562.6Q1902.2 1555.2 1902.2 1545Q1902.2 1534.6 1897.5 1527.3Q1892.7 1520.1 1883.7 1516.1Q1874.8 1512.1 1862.3 1512.1H1825.6Z", "cx": 1967.5, "cy": 1547.0}, "destello": {"d": "M1967.5 360C1956.2 300.4 1932.1 276.3 1872.5 265C1932.1 253.7 1956.2 229.6 1967.5 170C1978.8 229.6 2002.9 253.7 2062.5 265C2002.9 276.3 1978.8 300.4 1967.5 360Z", "cx": 1967.5, "cy": 265.0}, "reglas": [{"lado": "izq", "x": 170.0, "y": 1535.0, "w": 1502.6, "h": 20.0}, {"lado": "der", "x": 2262.4, "y": 1535.0, "w": 1502.6, "h": 20.0}]};

/* ---------- utilidades de tiempo ---------- */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const tw = (t, ini, dur) => clamp((t - ini) / dur, 0, 1);
const expoOut   = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);
const cubicOut  = p => 1 - Math.pow(1 - p, 3);
const cubicIO   = p => p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2;
const backOut   = p => { const c = 1.9; return 1 + (c+1)*Math.pow(p-1,3) + c*Math.pow(p-1,2); };
const lerp = (a, b, p) => a + (b - a) * p;

/* ---------- guion ---------- */
const T = {
  barrido:  [0.06, 0.62],
  letras:   [0.22, 0.12, 0.64],   // inicio, desfase entre letras, duracion
  giro:     [1.58, 0.62],
  reglas:   [2.08, 0.58],
  dj:       [2.26, 0.56],
  destello: [2.56, 0.46],
  fogonazo: [2.62, 0.17],
  fin:      5.40,
};
const DUR = T.fin;

const el = id => document.getElementById(id);
const nodes = {
  barrido: el('barrido'),
  ltr: [0,1,2,3].map(i => el('l' + i)),
  fantasma: el('fantasma'),
  reglas: [el('r0'), el('r1')],
  dj: el('dj'),
  sp: el('sp'),
  flash: el('flash'),
  stage: el('stage'),
};

function setTime(t) {
  t = clamp(t, 0, DUR);

  /* barrido magenta que deposita las letras */
  {
    const [ini, dur] = T.barrido;
    const p = tw(t, ini, dur), e = cubicIO(p);
    const y = lerp(D.vb[3] * 0.70, D.vb[3] * 0.26, e);
    const w = D.vb[2] * (p < .5 ? p * 2 : 1);
    const x = p < .5 ? 0 : (p - .5) * 2 * D.vb[2];
    nodes.barrido.setAttribute('y', y.toFixed(1));
    nodes.barrido.setAttribute('x', x.toFixed(1));
    nodes.barrido.setAttribute('width', Math.max(0, (p < .5 ? w : D.vb[2] - x)).toFixed(1));
    nodes.barrido.setAttribute('opacity', (p > 0 && p < 1 ? 0.95 : 0).toFixed(3));
  }

  /* las letras suben desde debajo de la linea de base */
  const [li, lstep, ldur] = T.letras;
  for (let i = 0; i < 4; i++) {
    const p = tw(t, li + i * lstep, ldur), e = expoOut(p);
    const dy = lerp(980, 0, e);
    const sc = lerp(1.09, 1, cubicOut(p));
    const c = D.letras[i];
    nodes.ltr[i].setAttribute('transform',
      `translate(0 ${dy.toFixed(1)}) translate(${c.cx} ${c.cy}) scale(${sc.toFixed(4)}) translate(${-c.cx} ${-c.cy})`);
  }

  /* la G se da vuelta: arranca sin espejar (scaleX -1) y gira a espejada (+1) */
  {
    const [ini, dur] = T.giro;
    const p = tw(t, ini, dur), e = cubicIO(p);
    const k = lerp(-1, 1, e);
    const c = D.g;
    const lp = tw(t, li + 2 * lstep, ldur);
    const dy = lerp(980, 0, expoOut(lp));
    nodes.ltr[2].setAttribute('transform',
      `translate(0 ${dy.toFixed(1)}) translate(${c.cx} ${c.cy}) scale(${k.toFixed(4)} 1) translate(${-c.cx} ${-c.cy})`);

    /* estela magenta: va por detras y se atrasa un poco */
    const pf = tw(t, ini + 0.05, dur), kf = lerp(-1, 1, cubicIO(pf));
    const vis = p > 0 && p < 1 ? Math.sin(Math.PI * p) * 0.85 : 0;
    nodes.fantasma.setAttribute('opacity', vis.toFixed(3));
    nodes.fantasma.setAttribute('transform',
      `translate(${(28 * Math.sin(Math.PI * p)).toFixed(1)} 0) translate(${c.cx} ${c.cy}) scale(${kf.toFixed(4)} 1) translate(${-c.cx} ${-c.cy})`);
  }

  /* los filetes se abren desde el centro hacia afuera */
  {
    const [ini, dur] = T.reglas;
    const e = expoOut(tw(t, ini, dur));
    D.reglas.forEach((R, i) => {
      const ox = i === 0 ? R.x + R.w : R.x;      // ancla en el borde interior
      nodes.reglas[i].setAttribute('transform',
        `translate(${ox} 0) scale(${e.toFixed(4)} 1) translate(${-ox} 0)`);
    });
  }

  /* bajada DJ */
  {
    const [ini, dur] = T.dj;
    const p = tw(t, ini, dur), e = expoOut(p);
    const c = D.dj, sc = lerp(0.82, 1, e), dy = lerp(44, 0, e);
    nodes.dj.setAttribute('opacity', cubicOut(tw(t, ini, dur * 0.6)).toFixed(3));
    nodes.dj.setAttribute('transform',
      `translate(0 ${dy.toFixed(1)}) translate(${c.cx} ${c.cy}) scale(${sc.toFixed(4)}) translate(${-c.cx} ${-c.cy})`);
  }

  /* destello */
  {
    const [ini, dur] = T.destello;
    const p = tw(t, ini, dur);
    const sc = backOut(p), rot = lerp(-110, 0, cubicOut(p));
    const c = D.destello;
    nodes.sp.setAttribute('opacity', clamp(p * 3, 0, 1).toFixed(3));
    nodes.sp.setAttribute('transform',
      `translate(${c.cx} ${c.cy}) rotate(${rot.toFixed(1)}) scale(${Math.max(0, sc).toFixed(4)}) translate(${-c.cx} ${-c.cy})`);
  }

  /* fogonazo corto al aparecer el destello */
  {
    const [ini, dur] = T.fogonazo;
    const p = tw(t, ini, dur);
    nodes.flash.style.opacity = (p > 0 && p < 1 ? Math.sin(Math.PI * p) * 0.075 : 0).toFixed(3);
  }

  /* respiracion final, apenas perceptible */
  {
    const p = tw(t, 3.0, 2.4);
    const sc = 1 + 0.012 * cubicOut(p);
    nodes.stage.style.transform = `scale(${sc.toFixed(4)})`;
  }
}

/* ---------- encuadre ---------- */
const q = new URLSearchParams(location.search);
const W = +(q.get('w') || 1080), H = +(q.get('h') || 1080);
const MARGEN = +(q.get('m') || 0.80);
const escena = document.getElementById('escena');
function encuadrar() {
  const fija = q.has('w');
  const w = fija ? W : Math.min(window.innerWidth, 900);
  const h = fija ? H : Math.round(w * 9 / 16);
  escena.style.width = w + 'px';
  escena.style.height = h + 'px';
  if (!fija) escena.style.marginTop = Math.max(0, (window.innerHeight - h) / 2) + 'px';
  const vbR = D.vb[2] / D.vb[3];
  let aw = w * MARGEN, ah = aw / vbR;
  if (ah > h * MARGEN) { ah = h * MARGEN; aw = ah * vbR; }
  const svg = nodes.stage;
  svg.style.width = aw + 'px'; svg.style.height = ah + 'px';
  svg.style.left = ((w - aw) / 2) + 'px'; svg.style.top = ((h - ah) / 2) + 'px';
  svg.style.transformOrigin = '50% 50%';
}
encuadrar();
addEventListener('resize', encuadrar);

/* modo alfa: para superponer el logo sobre video */
if (q.has('alpha')) {
  document.documentElement.style.background = 'transparent';
  document.body.style.background = 'transparent';
  escena.style.background = 'transparent';
  document.getElementById('grano').style.display = 'none';
  document.getElementById('flash').style.display = 'none';
}

/* ---------- reproduccion ---------- */
window.__dur = DUR;
window.__seek = t => { setTime(t); };
setTime(0);

if (!q.has('still')) {
  let t0 = null;
  const PAUSA = 1.1;
  function bucle(ts) {
    if (t0 === null) t0 = ts;
    const t = ((ts - t0) / 1000) % (DUR + PAUSA);
    setTime(Math.min(t, DUR));
    requestAnimationFrame(bucle);
  }
  requestAnimationFrame(bucle);
}
</script>
</body>
</html>
